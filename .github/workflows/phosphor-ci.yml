name: Phosphor CI

on:
  push:
    branches: [main]
    paths: ["phosphor/**", ".github/workflows/phosphor-ci.yml", "infra/smoke-images.sh", "infra/run-browser-qa.sh", "qa/**"]
  pull_request:
    paths: ["phosphor/**", ".github/workflows/phosphor-ci.yml", "infra/smoke-images.sh", "infra/run-browser-qa.sh", "qa/**"]

jobs:
  server:
    name: Phosphor server — lint & test
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: phosphor/server
    steps:
      - uses: actions/checkout@v4
      - name: Shared files are identical in StreamRD and Phosphor
        working-directory: .
        run: node scripts/sync-shared.cjs --check
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: phosphor/server/package-lock.json
      - run: npm ci
      - run: npx prisma generate
      - name: Typecheck
        run: npm run lint
      - name: Tests
        run: npm test

  web:
    name: Phosphor web — lint & build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: phosphor/web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: phosphor/web/package-lock.json
      - run: npm ci
      - name: Build
        run: npm run build

  docker:
    name: Phosphor Docker images build
    runs-on: ubuntu-24.04
    needs: [server, web]
    steps:
      - uses: actions/checkout@v4
      - name: Build backend image
        run: docker build -t phosphor-server ./phosphor/server
      - name: Build web image
        run: docker build -t phosphor-web ./phosphor/web
      - name: Validate production containers and database restoration
        run: bash infra/smoke-images.sh phosphor
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install browser test tooling
        run: npm ci --prefix qa
      - name: Install Chromium
        run: cd qa && npx playwright install --with-deps chromium
      - name: Exercise desktop and mobile product workflows
        env:
          QA_ARTIFACT_DIR: ${{ runner.temp }}/browser-qa
        run: bash infra/run-browser-qa.sh phosphor
      - name: Upload browser screenshots and validation report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: phosphor-browser-qa
          path: ${{ runner.temp }}/browser-qa
          if-no-files-found: ignore
