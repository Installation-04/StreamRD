name: Publish image

# Builds the all-in-one image (StreamRD, Phosphor and qBittorrent) on GitHub and
# publishes it to this repository's container registry, only for a version tag whose
# number matches the packages. Pull requests never publish; see single-container.yml
# for the build-and-exercise check that runs on every change.
on:
  push:
    tags:
      - "v*.*.*"
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  publish:
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v6

      - name: Verify the tag matches the package versions
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          for dir in server web phosphor/server phosphor/web; do
            version="$(node -p "require('./$dir/package.json').version")"
            [ "v$version" = "$RELEASE_TAG" ] || { echo "$dir is $version, not $RELEASE_TAG" >&2; exit 1; }
          done

      - uses: docker/setup-buildx-action@v4

      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Image name and tags
        id: meta
        uses: docker/metadata-action@v6
        with:
          # The action lower-cases the repository name, as registries require.
          images: ghcr.io/${{ github.repository }}
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=raw,value=latest
          labels: |
            org.opencontainers.image.title=StreamRD all-in-one
            org.opencontainers.image.description=StreamRD, Phosphor and qBittorrent in one supervised container

      - name: Build and push
        uses: docker/build-push-action@v7
        with:
          context: .
          platforms: linux/amd64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
