name: CI

on:
  push:
    branches: [main, beta, dev]
    paths-ignore: ["phosphor/**"]
  pull_request:
    paths-ignore: ["phosphor/**"]

jobs:
  server:
    name: Server — lint & test
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: server
    steps:
      - uses: actions/checkout@v6
      - name: Shared files are identical in StreamRD and Phosphor
        working-directory: .
        run: node scripts/sync-shared.cjs --check
      - uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: server/package-lock.json
      - run: npm ci
      - run: npx prisma generate
      - name: Typecheck
        run: npm run lint
      - name: Install ffmpeg (the conversion tests skip themselves without it)
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends ffmpeg
      - name: Tests
        run: npm test
      - name: Converted playback in Google Chrome (H.264 and AAC decoders)
        working-directory: .
        env:
          QA_ARTIFACT_DIR: ${{ runner.temp }}/playback-qa
        run: npm ci --prefix qa && node qa/converted-playback.cjs
      - name: Upload the playback report
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: streamrd-converted-playback
          path: ${{ runner.temp }}/playback-qa
          if-no-files-found: ignore

  journey:
    name: Owner's journey in Google Chrome
    runs-on: ubuntu-24.04
    # The whole product on one machine against a stand-in debrid account: first account, import, every kind of playback, seeking and
    # resuming, invitations, a child's limit, a request from search to playback, and the log. See qa/lab/.
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 24
      - name: Install ffmpeg
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends ffmpeg
      - name: Install dependencies
        run: npm ci --prefix server && npm ci --prefix web && npm ci --prefix qa
      - name: Run the journey
        env:
          QA_ARTIFACT_DIR: ${{ runner.temp }}/journey
        run: node qa/lab/journey.cjs
      - name: Converted video in Firefox (a small allowance of memory for video, as a Blu-ray rip needs more than Firefox gives)
        env:
          QA_ARTIFACT_DIR: ${{ runner.temp }}/journey-firefox
          JOURNEY_BROWSER: firefox
        run: cd qa && npx playwright install --with-deps firefox && cd .. && node qa/lab/journey.cjs
      - name: Upload the journey report and screenshots
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: streamrd-journey
          path: ${{ runner.temp }}/journey*
          if-no-files-found: ignore

  web:
    name: Web — lint & build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci
      - name: Build
        run: npm run build

  docker:
    name: Docker images build
    runs-on: ubuntu-24.04
    needs: [server, web]
    # Build and validate images without publishing them.
    steps:
      - uses: actions/checkout@v6
      - name: Build backend image
        run: docker build -t streamrd-server ./server
      - name: Build web image
        run: docker build -t streamrd-web ./web
      - name: Validate production containers and database restoration
        run: bash infra/smoke-images.sh streamrd
      - uses: actions/setup-node@v6
        with:
          node-version: 24
      - name: Install browser test tooling
        run: npm ci --prefix qa
      - name: Install Chromium
        run: cd qa && npx playwright install --with-deps chromium
      - name: Exercise desktop and mobile product workflows
        env:
          QA_ARTIFACT_DIR: ${{ runner.temp }}/browser-qa
        run: bash infra/run-browser-qa.sh streamrd
      - name: Upload browser screenshots and validation report
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: streamrd-browser-qa
          path: ${{ runner.temp }}/browser-qa
          if-no-files-found: ignore
