name: CI

on:
  push:
    branches: [main, beta, dev]
    paths-ignore: ["phosphor/**"]
  pull_request:
    paths-ignore: ["phosphor/**"]

jobs:
  server:
    name: Server — lint & test
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: server
    steps:
      - uses: actions/checkout@v6
      - name: Shared files are identical in StreamRD and Phosphor
        working-directory: .
        run: node scripts/sync-shared.cjs --check
      - uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: server/package-lock.json
      - run: npm ci
      - run: npx prisma generate
      - name: Typecheck
        run: npm run lint
      - name: Tests
        run: npm test

  web:
    name: Web — lint & build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci
      - name: Build
        run: npm run build

  docker:
    name: Docker images build
    runs-on: ubuntu-24.04
    needs: [server, web]
    # Build and validate images without publishing them.
    steps:
      - uses: actions/checkout@v6
      - name: Build backend image
        run: docker build -t streamrd-server ./server
      - name: Build web image
        run: docker build -t streamrd-web ./web
      - name: Validate production containers and database restoration
        run: bash infra/smoke-images.sh streamrd
      - uses: actions/setup-node@v6
        with:
          node-version: 24
      - name: Install browser test tooling
        run: npm ci --prefix qa
      - name: Install Chromium
        run: cd qa && npx playwright install --with-deps chromium
      - name: Exercise desktop and mobile product workflows
        env:
          QA_ARTIFACT_DIR: ${{ runner.temp }}/browser-qa
        run: bash infra/run-browser-qa.sh streamrd
      - name: Upload browser screenshots and validation report
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: streamrd-browser-qa
          path: ${{ runner.temp }}/browser-qa
          if-no-files-found: ignore
