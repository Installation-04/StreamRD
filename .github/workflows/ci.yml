name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  server:
    name: Server — lint & test
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: server
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: server/package-lock.json
      - run: npm ci || npm install
      - run: npx prisma generate
      - name: Typecheck
        run: npm run lint
      - name: Tests
        run: npm test

  web:
    name: Web — lint & build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci || npm install
      - name: Build
        run: npm run build

  docker:
    name: Docker images build
    runs-on: ubuntu-latest
    needs: [server, web]
    # Image build is a smoke test; publish from a release workflow instead.
    if: github.event_name == 'push'
    steps:
      - uses: actions/checkout@v4
      - name: Build backend image
        run: docker build -t streamrd-server ./server
      - name: Build web image
        run: docker build -t streamrd-web ./web
