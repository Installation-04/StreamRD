name: CI

on:
  push:
    branches: [main]
    paths-ignore: ["phosphor/**"]
  pull_request:
    paths-ignore: ["phosphor/**"]

jobs:
  server:
    name: Server — lint & test
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: server
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: server/package-lock.json
      - run: npm ci
      - run: npx prisma generate
      - name: Typecheck
        run: npm run lint
      - name: Tests
        run: npm test

  web:
    name: Web — lint & build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci
      - name: Build
        run: npm run build

  docker:
    name: Docker images build
    runs-on: ubuntu-latest
    needs: [server, web]
    # Build and validate images without publishing them.
    steps:
      - uses: actions/checkout@v4
      - name: Build backend image
        run: docker build -t streamrd-server ./server
      - name: Build web image
        run: docker build -t streamrd-web ./web
      - name: Validate production containers and database restoration
        run: bash infra/smoke-images.sh streamrd
