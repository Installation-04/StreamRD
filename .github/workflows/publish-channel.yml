name: Publish channel image

# Pre-release images. A push to `beta` publishes ghcr.io/<repo>:beta and a push to `dev` publishes
# :dev, after the same build-and-exercise check that every change gets. Releases (the :latest and
# version tags) still come only from tags on `main`; see publish-image.yml and docs/branches.md.
on:
  push:
    branches: [beta, dev]

permissions:
  contents: read
  packages: write

concurrency:
  group: publish-channel-${{ github.ref_name }}
  cancel-in-progress: true

jobs:
  publish:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v6

      - uses: docker/setup-buildx-action@v4

      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Image name and tags
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: ghcr.io/${{ github.repository }}
          tags: |
            type=raw,value=${{ github.ref_name }}
            type=sha,prefix=${{ github.ref_name }}-,format=short
          labels: |
            org.opencontainers.image.title=StreamRD all-in-one (${{ github.ref_name }} channel)
            org.opencontainers.image.description=Pre-release build of StreamRD, Phosphor and qBittorrent. Not for production.

      - name: Build and push
        uses: docker/build-push-action@v7
        with:
          context: .
          platforms: linux/amd64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
