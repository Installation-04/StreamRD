name: Single container
on:
  push:
    branches: [main, beta, dev]
  pull_request:
jobs:
  installer-bare:
    name: Installer on a machine with no Docker (${{ matrix.image }})
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        image: ["ubuntu:24.04", "debian:12"]
    steps:
      - uses: actions/checkout@v6
      - name: install.sh installs curl, tar, Docker and the Compose plugin, and starts Docker, on an image that has none of them
        run: |
          docker run --rm --privileged -v "$PWD:/src:ro" ${{ matrix.image }} bash -euxc '
            ! command -v docker && ! command -v curl
            bash /src/install.sh --yes --prepare
            docker --version
            docker compose version
            docker info --format "{{.ServerVersion}}"
          '
  bundle:
    name: Build and exercise the complete container
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v6
      - name: Installer script (files, ports, media server add-ons)
        run: bash infra/test-install-script.sh
      - name: Build all-in-one image
        run: docker build -t streamrd-all-in-one:local .
      - uses: actions/setup-node@v6
        with:
          node-version: 24
      - run: npm ci --prefix qa
      - name: Install Chromium
        run: cd qa && npx playwright install --with-deps chromium
      - name: Validate real bundled services and browser routing
        env:
          QA_SINGLE_BROWSER: "1"
          QA_ARTIFACT_DIR: ${{ runner.temp }}/single-container-qa
        run: bash infra/smoke-single-container.sh
      - name: Docker control against a real Docker daemon (launch, restart, update, rollback)
        run: bash infra/smoke-docker-control.sh streamrd-all-in-one:local
      - name: Every add-on from the marketplace against a real Docker daemon (install, answer, stop, start, remove)
        timeout-minutes: 40
        run: bash infra/smoke-addons.sh streamrd-all-in-one:local
      - uses: actions/upload-artifact@v6
        if: always()
        with:
          name: single-container-browser-qa
          path: ${{ runner.temp }}/single-container-qa
          if-no-files-found: ignore
