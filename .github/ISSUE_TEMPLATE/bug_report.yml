name: Bug report
description: Help us reproduce a problem in StreamRD or Phosphor.
body:
  - type: dropdown
    id: product
    attributes:
      label: Affected product
      options: [StreamRD, Phosphor, Shared deployment]
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: Version or commit
      placeholder: v0.3.0
    validations:
      required: true
  - type: textarea
    id: reproduce
    attributes:
      label: Steps and expected behavior
      description: Include browser/device and deployment details relevant to reproducing it.
    validations:
      required: true
  - type: textarea
    id: evidence
    attributes:
      label: Sanitized evidence
      description: Screenshots or request IDs help. Never include tokens, provider keys, private URLs, environment files, or databases.
