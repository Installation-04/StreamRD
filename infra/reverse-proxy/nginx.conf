# Nginx alternative to the Caddyfile. Mount into an nginx:alpine container
# (or drop into /etc/nginx/conf.d/) and supply your own TLS certificates,
# e.g. via certbot.

server {
    listen 80;
    server_name media.example.com;
    # Redirect all HTTP to HTTPS once certificates are installed.
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl;
    http2 on;
    server_name media.example.com;

    ssl_certificate     /etc/letsencrypt/live/media.example.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/media.example.com/privkey.pem;

    # Streams can be large; don't buffer video through the proxy.
    proxy_buffering off;
    client_max_body_size 10m;

    location /api/ {
        proxy_pass http://backend:4000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location / {
        proxy_pass http://web:3000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
