[package]
name = "phosphor-desktop"
version = "0.1.0"
description = "Native desktop wrapper for Phosphor, a self-hosted debrid cockpit"
authors = ["Phosphor"]
edition = "2021"
rust-version = "1.77"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
url = "2"

[profile.release]
panic = "abort"
codegen-units = 1
lto = true
opt-level = "s"
strip = true
